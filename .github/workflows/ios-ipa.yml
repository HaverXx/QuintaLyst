name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "gradlew"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Quintalyst for iPhone
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          xcodebuild \
            -project ios/Quintalyst.xcodeproj \
            -scheme Quintalyst \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/Quintalyst.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/Quintalyst.app
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/Quintalyst-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: quintalyst-ios-unsigned-ipa
          path: build/Quintalyst-unsigned.ipa
          if-no-files-found: error
